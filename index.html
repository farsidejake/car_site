<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Car Push Position</title>
        <link rel="stylesheet" href="carsite.css">
    </head>
    <body>
        <script src="carpush.js"></script>
        <h1 id="title">Car Push Position</h1>
        <section id="car_selection">
            <form>     
                <p class="normal-text">Please select the value for number car push.</p>
                <input type="radio" id="6" name="car_push" class="car_push" value="6">
                <label for="6">6</label><br>
                <input type="radio" id="7" name="car_push" class="car_push" value="7">
                <label for="7">7</label><br>
                <input type="radio" id="8" name="car_push" class="car_push" value="8">
                <label for="8">8</label><br>
                <input type="radio" id="9" name="car_push" class="car_push" value="9">
                <label for="9">9</label><br>
                <input type="radio" id="10" name="car_push" class="car_push" value="10" checked>
                <label for="10">10</label><br>
                <input type="radio" id="11" name="car_push" class="car_push" value="11">
                <label for="11">11</label><br>
                <input type="radio" id="12" name="car_push" class="car_push" value="12">
                <label for="12">12</label><br>
                <input type="radio" id="13" name="car_push" class="car_push" value="13">
                <label for="13">13</label><br>
                <input type="radio" id="14" name="car_push" class="car_push" value="14">
                <label for="14">14</label><br>
                <button type="button" onclick="main()">
                    Submit
                </button>
            </form> 
        </section>
        <section id="info-display">
            <div id="currentTimeDisplay"></div>
            <h2>Car Position: <span id="carPositionDisplay"></span></h2>
            <h2>Rate: <span name="chargeRateDisplay" id="chargeRateDisplay"></span></h2>
            <h2>Times:</h2>
            <div id="chargeTimesDisplay"></div>
            <button type="button" onclick="toggle_time_display()">12/24hr</button>
        </section>
    </body>
</html>
